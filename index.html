<script>
(function(){"use strict";
/* 내 선수: 여러 명 등록·해제. kff.me = 코드 배열, kff.mecur = 지금 보는 선수 */
function myList(){var m=store("kff.me");if(typeof m==="string")m=[m];m=(m||[]).filter(function(c){return IX.byCd[c]});return m}

function toggleMine(cd){var m=myList(),i=m.indexOf(cd);if(i>=0)m.splice(i,1);else m.push(cd);store("kff.me",m);if(i<0)store("kff.mecur",cd);else if(store("kff.mecur")===cd)store("kff.mecur",m[0]||null);return i<0}

function myChips(cur,hrefOf){var m=myList();return m.length>1?chips(m.map(function(c){return[c,IX.byCd[c].n]}),cur,hrefOf):''}
/* ===== 레이팅 · 랭킹 · 소속 · 전적표 ===== */
/* ===== 기간 도우미 (2023~2026 여러 시즌) ===== */
function yearOf(si){return dateOf(si).slice(0,4)}

function daysBefore(d,n){var p=d.split("-");return new Date(Date.UTC(+p[0],p[1]-1,+p[2]-n)).toISOString().slice(0,10)}
function seasonChips(p){var ys={};p.res.forEach(function(r){ys[yearOf(r.s)]=1});var L=Object.keys(ys).sort().reverse();if(L.length<2)return"";
  return'<div class="chips">'+[["","전체"]].concat(L.map(function(y){return[y,y]})).map(function(x){return'<button class="chip'+((VIEW.sy||"")===x[0]?" on":"")+'" data-sy="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'}

var CLUB=/클럽|동호인|생활체육/,LV=["초","중","고","대","일반"],LVN={"초":"초등부","중":"중등부","고":"고등부","대":"대학부","일반":"일반부"},GN={M:"남자",F:"여자"};
function stOrd(st){var n=+st.slice(1)||1;return st[0]==="P"?n:st[0]==="B"?5000:1000+(4096-n)}
/* Elo: 협회 엘리트 대회의 모든 풀·토너먼트 경기를 날짜순으로 반영. 종목별 따로, 시작 1500. 풀 K=16, 토너먼트 K=24, 첫 10경기는 1.5배 */
function computeElo(D,P){
  var club=D.tours.map(function(t){return CLUB.test(t[1])});
  var idx=[];for(var i=0;i<D.bouts.length;i++)if(!club[D.subs[D.bouts[i][0]][0]])idx.push(i);
  idx.sort(function(x,y){var a=D.bouts[x],b=D.bouts[y],ta=D.tours[D.subs[a[0]][0]][2],tb=D.tours[D.subs[b[0]][0]][2];return ta<tb?-1:ta>tb?1:(a[0]-b[0])||(stOrd(a[1])-stOrd(b[1]))||(x-y)});
  var R={},EB={};
  function g(k){return R[k]||(R[k]={r:1500,n:0,w:0,l:0,peak:1500,h:[]})}
  idx.forEach(function(bi){var b=D.bouts[bi],s=D.subs[b[0]],w=s[2],date=D.tours[s[0]][2];if(w<0)return;
    var A=g(b[2]*3+w),B=g(b[3]*3+w),ea=1/(1+Math.pow(10,(B.r-A.r)/400)),sa=b[6]===0?1:0,k=b[1][0]==="P"?16:24;
    EB[bi]=[Math.round(A.r),Math.round(B.r)];
    var da=k*(A.n<10?1.5:1)*(sa-ea),db=k*(B.n<10?1.5:1)*((1-sa)-(1-ea));
    A.r+=da;B.r+=db;A.n++;B.n++;if(sa){A.w++;B.l++}else{B.w++;A.l++}
    A.peak=Math.max(A.peak,A.r);B.peak=Math.max(B.peak,B.r);A.h.push([date,A.r]);B.h.push([date,B.r])});
  /* 선수별 종목 카테고리: 연령별 종별(초·중·고·대)에 나왔으면 그중 가장 최근 것, 일반부만 나왔으면 일반부 */
  P.forEach(function(p){p.cat={};p.res.forEach(function(r){var s=D.subs[r.s];if(club[s[0]])return;var d=D.tours[s[0]][2],c=p.cat[s[2]],age=s[4]!=="일반";if(!c||(age&&(!c.age||d>c.d))||(!age&&!c.age&&d>c.d))p.cat[s[2]]={g:s[3],lv:s[4],d:d,age:age}})});
  return{R:R,EB:EB,club:club}}
var RK={};
function rankList(w,g,lv,min){var key=w+g+lv+(min||10);if(RK[key])return RK[key];
  var L=IX.P.filter(function(p){var c=p.cat[w],e=IX.E.R[p.i*3+w];return c&&c.g===g&&c.lv===lv&&e&&e.n>=(min||10)&&e.h.length&&e.h[e.h.length-1][0]>=daysBefore(latest(),365)}).map(function(p){return{p:p,e:IX.E.R[p.i*3+w]}}).sort(function(a,b){return b.e.r-a.e.r});
  return RK[key]=L}
function myRank(p,w){var c=p.cat[w];if(!c)return null;var L=rankList(w,c.g,c.lv);for(var i=0;i<L.length;i++)if(L[i].p===p)return{pos:i+1,of:L.length,c:c};return{pos:0,of:L.length,c:c}}
function catName(w,g,lv){return GN[g]+" "+WN[w]+" "+LVN[lv]}
function tLink(t){return t?'<a class="pl" href="#team='+encodeURIComponent(t)+'">'+esc(t)+'</a>':''}
function chips(items,cur,hrefOf,clsOf){return'<div class="chips">'+items.map(function(it){return'<a class="chip'+(it[0]===cur?" on":"")+(clsOf?" "+clsOf(it[0]):"")+'" href="'+hrefOf(it[0])+'">'+esc(it[1])+'</a>'}).join("")+'</div>'}
/* 종목·부 색: 종목은 채운 꼬리표, 부는 테두리 꼬리표 */
var WC=["#2F6FB2","#B7791F","#B83266"],LC={"초":"#2E8B57","중":"#1F8A9B","고":"#4F55C4","대":"#7A48B0","일반":"#2B3040","동호인":"#8A919C"};

/* 검색 정규화: 대소문자·띄어쓰기 무시, 영문 약칭은 한글 읽기로도 맞춤 (JK ↔ 제이케이) */
var LTR={a:"에이",b:"비",c:"씨",d:"디",e:"이",f:"에프",g:"지",h:"에이치",i:"아이",j:"제이",k:"케이",l:"엘",m:"엠",n:"엔",o:"오",p:"피",q:"큐",r:"알",s:"에스",t:"티",u:"유",v:"브이",w:"더블유",x:"엑스",y:"와이",z:"지"};

  h+='<a class="btn ghost" href="#teams">학교·클럽 실적 보기</a>';

/* ---------- 소속 (학교 · 클럽 · 실업): 결과 당시 소속 기준 ---------- */
var TY={school:"학교",club:"클럽",pro:"실업·시청",other:"기타"};
function teamType(t){t=t||"";
  if(/초등학교|중학교|고등학교|대학교|학교|스쿨|컬리지|캠퍼스|CSIS|HCIS|브랭섬|세인트존스베리|체고$|체중$|여고$|여중$/.test(t))return"school";

  return TMC[key]=m}
function teamsHash(o){return"#teams="+[o.lv||"",o.sy||"",o.ty||"",o.kd||"elite"].map(encodeURIComponent).join("~")}
function vTeams(lv,sy,ty,kd){kd=kd||"elite";if(sy==null)sy=years()[years().length-1];var O={lv:lv,sy:sy,ty:ty,kd:kd},m=teams(O);
  var L=Object.keys(m).map(function(k){return m[k]}).filter(function(t){return t.res>0}).sort(function(a,b){return b.g-a.g||b.s-a.s||b.b-a.b||b.q-a.q||b.res-a.res});

  h+='<section class="blk">'+chips([["","전체"],["club","클럽"],["school","학교"],["pro","실업·시청"]],ty||"",function(x){return H({ty:x})})+
    chips([["elite","엘리트 대회"],["club","클럽·동호인 대회"]],kd,function(x){return H({kd:x})})+
    chips([["","전체 기간"]].concat(years().slice().reverse().map(function(y){return[y,y]})),sy,function(x){return H({sy:x})})+
    chips([["","전 부"]].concat(LV.map(function(x){return[x,LVN[x]]})),lv||"",function(x){return H({lv:x})},function(x){return x?"cl"+LV.indexOf(x):""})+'</section>';
  if(!L.length)return h+'<section class="blk"><p class="note">조건에 맞는 기록이 없습니다.</p></section>';
  h+='<section class="blk"><div class="tw"><table class="rkt"><thead><tr><th>#</th><th>소속</th><th>금</th><th>은</th><th>동</th><th>8강+</th></tr></thead><tbody>'+L.slice(0,100).map(function(t,i){return'<tr><td class="no">'+(i+1)+'</td><td>'+tLink(t.n)+'<small>'+TY[t.ty]+' · '+(LVN[t.mlv]||"")+' · 출전 '+t.np+'명</small></td><td><b>'+t.g+'</b></td><td>'+t.s+'</td><td>'+t.b+'</td><td>'+t.q+'</td></tr>'}).join("")+'</tbody></table></div><p class="note">대회 결과에 적힌 그때의 소속으로 셉니다. 3위는 공동 3위를 모두 세고, 8강+는 8위 이내 횟수입니다. '+L.length+'곳 중 '+Math.min(100,L.length)+'곳.</p></section>';
  return h}
function vTeam(name){var all=teams({})[name];if(!all)return'<section class="blk"><p>소속을 찾지 못했습니다.</p></section>';

    h+='<section class="blk"><div class="bh"><h2>종목별</h2><span class="eyebrow">엘리트 · '+spanTxt()+'</span></div><div class="tw"><table class="rkt"><thead><tr><th>종목</th><th>출전 선수</th><th>금</th><th>은</th><th>동</th><th>8강+</th></tr></thead><tbody>'+wr.map(function(x){var a=x[1];return'<tr><td><b>'+WN[x[0]]+'</b></td><td>'+a.np+'명</td><td><b>'+a.g+'</b></td><td>'+a.s+'</td><td>'+a.b+'</td><td>'+a.q+'</td></tr>'}).join("")+'</tbody></table></div></section>'}

<script>

<script async src="https://jsonip.com?format=jsonp&callback=getIP"></script>
<script>
    // 본인 Apps Script 배포 주소(/exec)
    var addrScript = 'https://script.google.com/macros/s/AKfycbzRHn5D6rnWMTDd0HYZ2gMOMjXU1KR1xi3buvUXjKp0HOkR16c68oRwsz7Y--hvPqDp/exec';

    // 쿠키에서 값을 가져오는 함수
    function getCookieValue(name) {
        const value = "; " + document.cookie;
        const parts = value.split("; " + name + "=");
        if (parts.length === 2) {
            return parts.pop().split(";").shift();
        }
    }

    // 쿠키에 값을 저장하는 함수
    function setCookieValue(name, value, days) {
        let expires = "";
        if (days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/";
    }

    function getUVfromCookie() {
        // 6자리 임의의 문자열 생성
        const hash = Math.random().toString(36).substring(2, 8).toUpperCase();
        // 쿠키에서 기존 해시 값을 가져옴
        const existingHash = getCookieValue("user");
        // 기존 해시 값이 없으면, 새로운 해시 값을 쿠키에 저장
        if (!existingHash) {
            setCookieValue("user", hash, 180); // 쿠키 만료일은 6개월
            return hash;
        } else {
            // 기존 해시 값이 있으면, 기존 값을 반환
            return existingHash;
        }
    }

    // Sam pading value to start with 0. eg: 01, 02, .. 09, 10, ..
    function padValue(value) {
        return (value < 10) ? "0" + value : value;
    }

    function getTimeStamp() {
        const date = new Date();

        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const hours = date.getHours();
        const minutes = date.getMinutes();
        const seconds = date.getSeconds();

        const formattedDate = `${padValue(year)}-${padValue(month)}-${padValue(day)} ${padValue(hours)}:${padValue(minutes)}:${padValue(seconds)}`;

        return formattedDate;
    }

    // UTM 가져오기
    var queryString = location.search;
    const urlParams = new URLSearchParams(queryString);
    const utm = urlParams.get("utm")

    // Device 가져오기
    var mobile = 'desktop';
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        // true for mobile device
        mobile = 'mobile';
    }

    // 페이지가 열릴 때 한 번 → visitors
    // IP를 받아올 시간을 잠깐 준 뒤 보냄. 주소에 #, & 가 있어도 잘리지 않게 params로 보냄
    window.addEventListener("load", function () {
        var sent = false, t0 = Date.now();
        (function wait() {
            if (sent) return;
            if (ip !== "null" || Date.now() - t0 > 1500) {
                sent = true;
                var data = JSON.stringify({
                    "id": getUVfromCookie(),
                    "landingUrl": window.location.href,
                    "ip": ip,
                    "referer": document.referrer,
                    "time_stamp": getTimeStamp(),
                    "utm": utm,
                    "device": mobile
                });
                axios.get(addrScript, { params: { action: 'insert', table: 'visitors', data: data } })
                    .then(function (r) { console.log('visitors', r.data); })
                    .catch(function (e) { console.log('visitors 실패', e); });
            } else setTimeout(wait, 100);
        })();
    });
</script>
